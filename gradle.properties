org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

## Mod metadata
mod_id=pocketmanor
mod_name=Pocket Manor
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.windchaser.pocketmanor
mod_authors=windchaser1234
mod_description=Adds the Pocket Manor spell for Iron's Spells 'n Spellbooks: an upgraded pocket dimension that teleports you into a single shared manor per world.

## Minecraft + NeoForge (1.21.1)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.209
neo_version_range=[21.1.0,)
loader_version_range=[4,)

## Iron's Spells 'n Spellbooks
# Mod id of the base mod we depend on.
irons_spellbooks_id=irons_spellbooks
# Minimum version accepted at runtime (shown in neoforge.mods.toml dependency).
irons_spellbooks_version_range=[3.11.0,)

## CurseForge file IDs used by build.gradle (see README).
## Replace each <FILE_ID> with the numeric file id for the 1.21.1 / NeoForge build
## you want to compile against, taken from the file's CurseForge download URL.
# Iron's Spells 'n Spellbooks  -> project 855414
irons_spellbooks_curse_file=0
# GeckoLib (rendering/animation dep referenced by the ISS API) -> project 388172
geckolib_curse_file=0
# Curios API (referenced by AbstractSpell) -> project 309927
curios_curse_file=0
